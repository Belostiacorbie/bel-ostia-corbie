<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bel Ostia — Admin V5</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5}main{max-width:1100px;margin:auto;padding:20px 14px}.panel{background:white;border:1px solid #ddd;border-radius:18px;padding:20px;margin-bottom:14px}input,select{padding:10px;border:1px solid #ccc;border-radius:9px}input[type=email],input[type=password]{width:100%;margin:6px 0 12px}.row{display:grid;grid-template-columns:2fr 90px 60px 60px 95px 95px;gap:7px;align-items:center;border-bottom:1px solid #eee;padding:9px 0}.zero{opacity:.5}button{border:0;border-radius:9px;padding:9px;font-weight:bold;cursor:pointer}.primary{background:#a71928;color:white}.dark{background:#171717;color:white}.notice{background:#fff0c7;padding:10px;border-radius:10px;font-size:13px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}@media(max-width:750px){.row{grid-template-columns:1fr 60px 48px 48px 80px 80px;font-size:12px}}</style></head><body><main>
<div class="panel"><h1>Bel Ostia — Administration V5</h1><div id="notice" class="notice"></div></div>
<div id="login" class="panel"><h2>Connexion</h2><input id="email" type="email" placeholder="E-mail administrateur"><input id="password" type="password" placeholder="Mot de passe"><button class="primary" onclick="signIn()">Se connecter</button></div>
<div id="dash" class="panel" style="display:none"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Stocks de tous les produits</h2><button class="dark" onclick="signOut()">Déconnexion</button></div><div class="filters"><select id="filter" onchange="render()"><option value="">Toutes les catégories</option></select></div><div id="list"></div></div>
<script src="shared.js"></script><script>
let rows=[];
async function boot(){notice.textContent=connected?"Mode connecté Supabase.":"Mode aperçu local : le vrai login partagé sera activé après configuration Supabase.";if(connected){const {data}=await sb.auth.getSession();if(data?.session)show();}}
async function signIn(){if(connected){const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error)return alert(error.message);return show();}if(!email.value||!password.value)return alert("Entre un e-mail et un mot de passe.");sessionStorage.setItem("preview","1");show();}
async function signOut(){if(connected)await sb.auth.signOut();sessionStorage.removeItem("preview");location.reload();}
async function show(){login.style.display="none";dash.style.display="block";rows=await getStockRows();const cats=[...new Set(rows.map(x=>x.category))];filter.innerHTML='<option value="">Toutes les catégories</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join("");render();}
function render(){const f=filter.value;const a=f?rows.filter(x=>x.category===f):rows;list.innerHTML=a.map(x=>`<div class="row ${(!x.enabled||x.stock<=0)?'zero':''}"><div><b>${esc(x.name)}</b><br><small>${esc(x.category)}</small></div><input type="number" min="0" value="${x.stock}" onchange='exact(${JSON.stringify(x.sku)},this.value)'><button onclick='plus(${JSON.stringify(x.sku)},1)'>+1</button><button onclick='plus(${JSON.stringify(x.sku)},-1)'>-1</button><button onclick='rupture(${JSON.stringify(x.sku)})'>Rupture</button><button onclick='toggle(${JSON.stringify(x.sku)},${!x.enabled})'>${x.enabled?'Masquer':'Réactiver'}</button></div>`).join("")}
async function refresh(){rows=await getStockRows();render()}async function exact(s,v){await setQty(s,v);await refresh()}async function plus(s,d){await addQty(s,d);await refresh()}async function rupture(s){await setQty(s,0);await refresh()}async function toggle(s,e){await toggleAvailability(s,e);await refresh()}boot();
</script></body></html>
