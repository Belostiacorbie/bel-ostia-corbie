<!doctype html><html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bel Ostia Corbie</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff8ef;color:#181818}header{background:#151515;color:#fff;text-align:center;padding:18px;position:sticky;top:0;z-index:5}header b{font-size:30px}
main{max-width:1120px;margin:auto;padding:18px 14px 115px}.hero{background:#a71928;color:#fff;border-radius:24px;padding:30px 22px}.chips{display:flex;gap:8px;overflow:auto;padding:16px 0}.chip{white-space:nowrap;background:#fff;border:1px solid #ddd;border-radius:999px;padding:10px 13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:12px}.card{background:#fff;border:1px solid #eadfd5;border-radius:18px;padding:16px;display:flex;flex-direction:column}.card h3{margin:0 0 6px}.desc{font-size:13px;color:#6e6259;min-height:34px}.price{font-weight:900;margin:9px 0}.stockno{font-size:12px;color:#a71928;font-weight:bold}
button{border:0;border-radius:12px;padding:12px 14px;font-weight:800;cursor:pointer}.add,.primary{background:#a71928;color:#fff}.add{width:100%;margin-top:auto}.add:disabled{background:#aaa}.cart{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#151515;color:#fff;border-radius:999px;padding:14px 22px;z-index:10}
.overlay{display:none;position:fixed;inset:0;background:#000b;z-index:30;align-items:center;justify-content:center;padding:16px}.wizard{background:#fff;width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:26px;padding:24px}.wizard h2{font-size:28px;margin:0 0 8px}.step{font-size:13px;color:#777;margin-bottom:14px}.big-choice,.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.big-choice button{min-height:74px;border:2px solid #e5ddd6;background:#fff;font-size:16px}.choice{border:2px solid #e5ddd6;background:#fff;text-align:left}.selected{border-color:#a71928!important;background:#fff0f1!important}.removed{background:#f6e3e5!important;border-color:#a71928!important;text-decoration:line-through}.nav{display:flex;gap:10px;margin-top:20px}.nav button{flex:1}.secondary{background:#eee}.summary{background:#faf7f2;border:1px solid #e8ddd4;border-radius:16px;padding:15px;margin:12px 0}.title2{font-size:21px;margin:12px 0}
.cartmodal{display:none;position:fixed;inset:0;background:#0009;z-index:20;align-items:flex-end;justify-content:center}.sheet{background:#fff;width:min(720px,100%);max-height:92vh;overflow:auto;padding:20px;border-radius:22px 22px 0 0}.row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #eee;padding:10px 0}input,textarea,select{width:100%;padding:11px;border:1px solid #d7ccc3;border-radius:10px;margin:7px 0}
@media(max-width:600px){.big-choice,.options{grid-template-columns:1fr}}
</style></head><body>
<header><b>BEL OSTIA</b><div>Pizzeria • Corbie</div></header><main><div class="hero"><h1>Commandez chez Bel Ostia 🍕</h1><div>À emporter ou livraison • 28 rue Faidherbe, 80800 Corbie</div></div><div class="chips" id="chips"></div><div id="menu"></div></main>
<button class="cart" onclick="openCart()">🛒 <span id="count">0</span> • <span id="total">0,00 €</span></button>
<div class="overlay" id="ov"><div class="wizard"><div style="display:flex;justify-content:space-between"><div><h2 id="wt"></h2><div class="step" id="ws"></div></div><button class="secondary" onclick="closeW()">✕</button></div><div id="wb"></div><div class="nav"><button id="back" class="secondary" onclick="prev()">Retour</button><button id="next" class="primary" onclick="nextStep()">Continuer</button></div></div></div>
<div class="cartmodal" id="cartM"><div class="sheet"><div style="display:flex;justify-content:space-between"><h2>Panier</h2><button onclick="closeCart()">✕</button></div><div id="items"></div><select id="mode"><option>Livraison</option><option>À emporter</option></select><input id="customerName" placeholder="Nom et prénom"><input id="phone" placeholder="Téléphone"><input id="address" placeholder="Adresse"><textarea id="note" placeholder="Instructions"></textarea><button class="primary" style="width:100%" onclick="checkout()">Aller vers le paiement</button></div></div>
<script src="shared.js"></script><script>
let stock=[],cart=[],w=null;const cats=["Pizzas sauce tomate","Pizzas crème fraîche","Burgers","Sandwichs","Tacos","Paninis","Salades","Tex-Mex","Menus","Boissons","Desserts & glaces"];
async function boot(){stock=await getStockRows();render()}function ok(type,cat,name){const x=stock.find(r=>r.type===type&&r.category===cat&&r.name===name);return !!(x&&x.enabled&&x.stock>0)}
function productOk(p){return p.sizes?Object.keys(p.sizes).some(s=>ok("menu",p.cat,`${p.name} — ${s}`)):ok("menu",p.cat,p.name)}
function render(){chips.innerHTML=cats.map(c=>`<button class="chip" onclick="document.getElementById('c-${slug(c)}').scrollIntoView({behavior:'smooth'})">${c}</button>`).join("");let h="";cats.forEach(c=>{h+=`<section id="c-${slug(c)}"><h2>${c}</h2><div class="grid">`;if(c==="Boissons"){stock.filter(x=>x.type==="drink").forEach(x=>{const off=!x.enabled||x.stock<=0,pr=x.category.includes("33")?1.5:3;h+=`<div class="card"><h3>${esc(x.name)}</h3><div class="desc">${esc(x.category)}</div><div class="price">${euro(pr)}</div>${off?'<div class="stockno">Rupture</div>':''}<button class="add" ${off?'disabled':''} onclick='startDrink(${JSON.stringify(x.category)},${JSON.stringify(x.name)},${pr})'>${off?'Indisponible':'Choisir'}</button></div>`})}else{MENU.filter(p=>p.cat===c).forEach(p=>{const i=MENU.indexOf(p),off=!productOk(p),pr=p.sizes?`À partir de ${euro(Math.min(...Object.values(p.sizes)))}`:euro(p.price);h+=`<div class="card"><h3>${esc(p.name)}</h3><div class="desc">${esc(p.desc)}</div><div class="price">${pr}</div><button class="add" ${off?'disabled':''} onclick="start(${i})">${off?'Indisponible':'Personnaliser'}</button></div>`})}h+="</div></section>"});menu.innerHTML=h}
function ingredients(p){return (p.desc||"").split(",").map(x=>x.trim()).filter(Boolean)}
function steps(p){const a=[];if(p.sizes)a.push("size");a.push("ingredients");if(p.meatCount)a.push("meats","supps");if(["Burgers","Sandwichs"].includes(p.cat))a.push("menu");if(p.kids)a.push("kids");a.push("drink","dessert","summary");return a}
function start(i){const p=MENU[i];w={p,i,step:0,removed:[],meats:[],supps:[],menu:false,size:null,kids:null,drink:null,dessert:null};ov.style.display="flex";renderStep()}
function startDrink(cat,name,price){w={quick:true,cat,name,price,dessert:null};ov.style.display="flex";wt.textContent=name;ws.textContent="Ajout rapide";wb.innerHTML=`<div class="summary">${esc(cat)} • ${euro(price)}</div><div class="title2">Ajouter un dessert ? 🍰</div>${dessertChoices(true)}`;back.style.display="none";next.textContent="Ajouter";next.onclick=()=>{cart.push({name,detail:cat,price});if(w.dessert)cart.push({name:w.dessert.name,detail:"Dessert",price:w.dessert.price});update();closeW();afterAdd()}}
function renderStep(){const p=w.p,s=steps(p),k=s[w.step];wt.textContent=p.name;ws.textContent=`Étape ${w.step+1} / ${s.length}`;back.style.display=w.step?"block":"none";next.style.display="block";next.textContent=k==="summary"?"Ajouter au panier":"Continuer";next.onclick=nextStep;
if(k==="size"){const a=Object.entries(p.sizes).filter(([sz])=>ok("menu",p.cat,`${p.name} — ${sz}`));if(!w.size)w.size=a[0];wb.innerHTML=`<div class="title2">Quelle taille ?</div><div class="options">${a.map(x=>`<button class="choice ${w.size&&w.size[0]===x[0]?'selected':''}" onclick='w.size=${JSON.stringify(x)};renderStep()'><b>${x[0]}</b><br>${euro(x[1])}</button>`).join("")}</div>`}
else if(k==="ingredients"){const a=ingredients(p);wb.innerHTML=`<div class="title2">Retirer des ingrédients ?</div><div class="options">${a.length?a.map(x=>`<button class="choice ${w.removed.includes(x)?'removed':''}" onclick='toggleArr("removed",${JSON.stringify(x)},99)'>${w.removed.includes(x)?"✕":"✓"} ${esc(x)}</button>`).join(""):'<div class="summary">Aucun ingrédient détaillé.</div>'}</div>`}
else if(k==="meats"){const a=TACO_MEATS.filter(m=>ok("taco_meat","Viandes tacos",m.name));wb.innerHTML=`<div class="title2">Choisissez ${p.meatCount} viande(s)</div><div class="options">${a.map(m=>`<button class="choice ${w.meats.includes(m.name)?'selected':''}" onclick='toggleArr("meats",${JSON.stringify(m.name)},${p.meatCount})'>${esc(m.name)}${m.extra?`<br><b>+${euro(m.extra)}</b>`:""}</button>`).join("")}</div>`}
else if(k==="supps"){const a=TACO_SUPPLEMENTS.filter(x=>ok("taco_supplement","Suppléments tacos",x));wb.innerHTML=`<div class="title2">Suppléments tacos</div><div class="summary">+1,00 € par supplément</div><div class="options">${a.map(x=>`<button class="choice ${w.supps.includes(x)?'selected':''}" onclick='toggleArr("supps",${JSON.stringify(x)},99)'>${esc(x)}<br><b>+1,00 €</b></button>`).join("")}</div>`}
else if(k==="menu"){const ex=p.cat==="Burgers"?2.40:2.50;wb.innerHTML=`<div class="title2">Vous le voulez en menu ? 🍟🥤</div><div class="big-choice"><button class="${!w.menu?'selected':''}" onclick="w.menu=false;renderStep()">Produit seul</button><button class="${w.menu?'selected':''}" onclick="w.menu=true;renderStep()">En menu<br><b>+${euro(ex)}</b></button></div>`}
else if(k==="kids"){wb.innerHTML=`<div class="title2">Menu enfant — choisissez</div><div class="big-choice"><button class="${w.kids==='Cheeseburger'?'selected':''}" onclick="w.kids='Cheeseburger';renderStep()">🍔 Cheeseburger</button><button class="${w.kids==='5 nuggets'?'selected':''}" onclick="w.kids='5 nuggets';renderStep()">🍗 5 nuggets</button></div><div class="summary">Frites + Capri-Sun • 6,00 €</div>`}
else if(k==="drink"){wb.innerHTML=`<div class="title2">Ajouter une boisson ? 🥤</div><div class="big-choice"><button class="${!w.drink?'selected':''}" onclick="w.drink=null;renderStep()">Non merci</button><button onclick="drinkChoices()">Oui, choisir</button></div><div id="extra">${w.drink?`<div class="summary">${esc(w.drink.name)} • ${esc(w.drink.cat)} • ${euro(w.drink.price)}</div>`:""}</div>`}
else if(k==="dessert"){wb.innerHTML=`<div class="title2">Ajouter un dessert ? 🍰</div><div class="big-choice"><button class="${!w.dessert?'selected':''}" onclick="w.dessert=null;renderStep()">Non merci</button><button onclick="document.getElementById('extra').innerHTML=dessertChoices(false)">Oui, choisir</button></div><div id="extra">${w.dessert?`<div class="summary">${esc(w.dessert.name)} • ${euro(w.dessert.price)}</div>`:""}</div>`}
else{const c=calc();wb.innerHTML=`<div class="title2">Récapitulatif ✅</div><div class="summary">${c.lines.map(x=>`<div>${esc(x)}</div>`).join("")}<hr><b>Total : ${euro(c.total)}</b></div>`}}
function toggleArr(k,v,max){const a=w[k],i=a.indexOf(v);if(i>=0)a.splice(i,1);else if(a.length<max)a.push(v);else return alert(`Maximum ${max}`);renderStep()}
function drinkChoices(){const a=stock.filter(x=>x.type==="drink"&&x.enabled&&x.stock>0).slice(0,20);extra.innerHTML=`<div class="options">${a.map(x=>{const pr=x.category.includes("33")?1.5:3;return `<button class="choice" onclick='chooseDrink(${JSON.stringify(x.category)},${JSON.stringify(x.name)},${pr})'>${esc(x.name)}<br><small>${esc(x.category)}</small><br><b>${euro(pr)}</b></button>`}).join("")}</div>`}
function chooseDrink(cat,name,price){w.drink={cat,name,price};renderStep()}
function dessertChoices(quick){const a=MENU.filter(p=>p.cat==="Desserts & glaces"&&productOk(p));return `<div class="options">${a.map(p=>`<button class="choice" onclick='chooseDessert(${JSON.stringify(p.name)},${p.price},${quick})'>${esc(p.name)}<br><b>${euro(p.price)}</b></button>`).join("")}</div>`}
function chooseDessert(name,price,quick){w.dessert={name,price};if(quick){wb.innerHTML=`<div class="summary">${esc(w.cat)} • ${euro(w.price)}</div><div class="title2">Dessert choisi</div><div class="summary">${esc(name)} • ${euro(price)}</div>`}else renderStep()}
function prev(){if(w.step>0){w.step--;renderStep()}}
function nextStep(){const p=w.p,k=steps(p)[w.step];if(k==="meats"&&w.meats.length!==p.meatCount)return alert(`Choisissez exactement ${p.meatCount} viande(s).`);if(k==="kids"&&!w.kids)return alert("Choisissez Cheeseburger ou 5 nuggets.");if(k==="summary"){addConfigured();return}w.step++;renderStep()}
function calc(){const p=w.p;let total=p.price||0,detail=[],lines=[p.name];if(p.sizes&&w.size){total=+w.size[1];detail.push(w.size[0]);lines.push("Taille : "+w.size[0])}if(w.removed.length){detail.push("Sans : "+w.removed.join(", "));lines.push("Sans : "+w.removed.join(", "))}if(p.meatCount){const ex=w.meats.reduce((s,n)=>s+(TACO_MEATS.find(m=>m.name===n)?.extra||0),0);total+=ex;detail.push("Viandes : "+w.meats.join(", "));lines.push("Viandes : "+w.meats.join(", ")+(ex?` (+${euro(ex)})`:""))}if(w.supps.length){total+=w.supps.length;detail.push("Suppléments : "+w.supps.join(", "));lines.push(`Suppléments : ${w.supps.join(", ")} (+${euro(w.supps.length)})`)}if(["Burgers","Sandwichs"].includes(p.cat)&&w.menu){const ex=p.cat==="Burgers"?2.40:2.50;total+=ex;detail.push("En menu");lines.push(`En menu : +${euro(ex)}`)}if(p.kids&&w.kids){detail.push(w.kids+" + frites + Capri-Sun");lines.push(w.kids+" + frites + Capri-Sun")}return {total,detail:detail.join(" • "),lines}}
function addConfigured(){const c=calc();cart.push({name:w.p.name,detail:c.detail,price:c.total});if(w.drink)cart.push({name:w.drink.name,detail:w.drink.cat,price:w.drink.price});if(w.dessert)cart.push({name:w.dessert.name,detail:"Dessert",price:w.dessert.price});update();closeW();afterAdd()}
function closeW(){ov.style.display="none";w=null}function afterAdd(){ov.style.display="flex";wt.textContent="Ajouté au panier ✅";ws.textContent="Que voulez-vous faire ?";wb.innerHTML=`<div class="big-choice"><button onclick="closeW()">🍕 Continuer à commander</button><button class="selected" onclick="closeW();openCart()">🛒 Voir le panier / paiement</button></div>`;back.style.display="none";next.style.display="none"}
function update(){count.textContent=cart.length;total.textContent=euro(cart.reduce((s,x)=>s+x.price,0))}function openCart(){cartM.style.display="flex";items.innerHTML=cart.length?cart.map((x,i)=>`<div class="row"><div><b>${esc(x.name)}</b><br><small>${esc(x.detail||"")}</small></div><div>${euro(x.price)} <button onclick="cart.splice(${i},1);update();openCart()">Retirer</button></div></div>`).join(""):"Panier vide"}function closeCart(){cartM.style.display="none"}function checkout(){if(!cart.length)return alert("Panier vide.");if(!customerName.value||!phone.value)return alert("Nom et téléphone requis.");alert("Parcours prêt. Paiement réel à connecter ensuite.")}
boot();update();
</script></body></html>
