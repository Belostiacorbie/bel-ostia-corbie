<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bel Ostia Corbie — Commander</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff8ef;color:#181818}header{background:#151515;color:#fff;text-align:center;padding:18px;position:sticky;top:0;z-index:5}header b{font-size:30px}main{max-width:1120px;margin:auto;padding:18px 14px 115px}.hero{background:#a71928;color:white;border-radius:24px;padding:30px 22px}.chips{display:flex;gap:8px;overflow:auto;padding:16px 0}.chip{white-space:nowrap;background:#fff;border:1px solid #ddd;border-radius:999px;padding:10px 13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:12px}.card{background:white;border:1px solid #eadfd5;border-radius:18px;padding:16px;display:flex;flex-direction:column}.card h3{margin:0 0 6px}.desc{font-size:13px;color:#6e6259;min-height:34px}.price{font-weight:900;margin:9px 0}.stockno{font-size:12px;color:#a71928;font-weight:bold}.add,.primary{background:#a71928;color:#fff}button{border:0;border-radius:12px;padding:12px 14px;font-weight:800;cursor:pointer}.add{width:100%;margin-top:auto}.add:disabled{background:#aaa}.cart{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#151515;color:#fff;border-radius:999px;padding:14px 22px;z-index:10;box-shadow:0 8px 30px #0004}.overlay{display:none;position:fixed;inset:0;background:#000b;z-index:30;align-items:center;justify-content:center;padding:16px}.wizard{background:#fff;width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:26px;padding:24px;box-shadow:0 24px 80px #0005}.wizard h2{font-size:28px;margin:0 0 6px}.step{font-size:13px;color:#777;margin-bottom:14px}.title2{font-size:21px;font-weight:900;margin:10px 0}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.choice{border:2px solid #e7dfd7;background:#fff;text-align:left;min-height:64px}.choice.selected{border-color:#a71928;background:#fff0f1}.choice.removed{border-color:#a71928;background:#f6e3e5;text-decoration:line-through;color:#8e1723}.nav{display:flex;gap:10px;margin-top:20px}.nav button{flex:1}.secondary{background:#eee;color:#222}.summary{background:#faf7f2;border:1px solid #e8ddd4;border-radius:16px;padding:15px;margin:12px 0}.muted{font-size:13px;color:#6d6259}.cartmodal{display:none;position:fixed;inset:0;background:#0009;z-index:20;align-items:flex-end;justify-content:center}.sheet{background:#fff;width:min(720px,100%);max-height:92vh;overflow:auto;padding:20px;border-radius:22px 22px 0 0}.row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #eee;padding:10px 0}input,textarea,select{width:100%;padding:11px;border:1px solid #d7ccc3;border-radius:10px;margin:7px 0;font-size:15px}.admin{text-align:center;margin:35px 0}.admin a{font-size:12px;color:#777}@media(max-width:600px){.choices{grid-template-columns:1fr}.wizard h2{font-size:24px}}
</style></head><body>
<header><b>BEL OSTIA</b><div>Pizzeria • Corbie</div></header><main><div class="hero"><h1>Commandez chez Bel Ostia 🍕</h1><div>À emporter ou livraison • 28 rue Faidherbe, 80800 Corbie</div></div><div class="chips" id="chips"></div><div id="statusMsg" style="display:none;background:#fff0c7;padding:10px;border-radius:10px;margin:10px 0"></div><div id="menu"></div><div class="admin"><a href="admin.html">Accès administration</a></div></main>
<button class="cart" onclick="openCart()">🛒 <span id="count">0</span> • <span id="total">0,00 €</span></button>
<div class="overlay" id="overlay"><div class="wizard"><div style="display:flex;justify-content:space-between;gap:10px"><div><h2 id="wizTitle"></h2><div class="step" id="wizStep"></div></div><button class="secondary" onclick="closeWizard()">✕</button></div><div id="wizBody"></div><div class="nav"><button class="secondary" id="backBtn" onclick="prevStep()">Retour</button><button class="primary" id="nextBtn" onclick="nextStep()">Continuer</button></div></div></div>
<div class="cartmodal" id="cartModal"><div class="sheet"><div style="display:flex;justify-content:space-between"><h2>Votre panier</h2><button onclick="closeCart()">✕</button></div><div id="items"></div><select id="mode"><option>Livraison</option><option>À emporter</option></select><input id="customerName" placeholder="Nom et prénom"><input id="phone" placeholder="Téléphone"><input id="address" placeholder="Adresse"><textarea id="note" placeholder="Instructions"></textarea><button class="primary" style="width:100%" onclick="checkout()">Aller vers le paiement</button></div></div>
<script src="shared.js"></script><script>
window.addEventListener('error',e=>{const el=document.getElementById('statusMsg');if(el){el.style.display='block';el.textContent='Le menu a rencontré une erreur de chargement. Rechargez la page. Détail: '+(e.message||'erreur inconnue');}});
let stock=[],cart=[],wiz=null;
const cats=['Pizzas sauce tomate','Pizzas crème fraîche','Burgers','Sandwichs','Tacos','Paninis','Salades','Tex-Mex','Menus','Boissons','Desserts & glaces'];
const CUSTOM_CATS=new Set(['Pizzas sauce tomate','Pizzas crème fraîche','Burgers','Sandwichs','Tacos','Paninis','Salades']);
async function boot(){
  try{
    stock=DEFAULT_STOCK.map(x=>({...x}));
    render();
    const loaded=await getStockRows();
    if(Array.isArray(loaded)&&loaded.length){stock=loaded;render();}
  }catch(e){
    console.error('Erreur de démarrage',e);
    stock=DEFAULT_STOCK.map(x=>({...x}));
    render();
  }
}
function isEnabled(type,cat,name){
  const r=stock.find(x=>x.type===type&&x.category===cat&&x.name===name);
  if(!r) return true;
  return !!(r.enabled&&Number(r.stock)>0);
}
function productEnabled(p){if(p.sizes)return Object.keys(p.sizes).some(s=>isEnabled('menu',p.cat,p.name+' — '+s));return isEnabled('menu',p.cat,p.name)}
function render(){chips.innerHTML=cats.map(c=>`<button class="chip" onclick="document.getElementById('c-${slug(c)}').scrollIntoView({behavior:'smooth'})">${c}</button>`).join('');let h='';for(const c of cats){h+=`<section id="c-${slug(c)}"><h2>${c}</h2><div class="grid">`;if(c==='Boissons'){for(const x of stock.filter(r=>r.type==='drink')){const off=!x.enabled||x.stock<=0,pr=x.category.includes('33')?1.5:3;h+=`<div class="card"><h3>${esc(x.name)}</h3><div class="desc">${esc(x.category)}</div><div class="price">${euro(pr)}</div>${off?'<div class="stockno">Rupture de stock</div>':''}<button class="add" ${off?'disabled':''} onclick="quickDrink('${encodeURIComponent(x.category)}','${encodeURIComponent(x.name)}',${pr})">${off?'Indisponible':'Ajouter'}</button></div>`}}else{for(const p of MENU.filter(q=>q.cat===c)){const i=MENU.indexOf(p),off=!productEnabled(p),pr=p.sizes?'À partir de '+euro(Math.min(...Object.values(p.sizes))):euro(p.price);h+=`<div class="card"><h3>${esc(p.name)}</h3><div class="desc">${esc(p.desc)}</div><div class="price">${pr}</div>${off?'<div class="stockno">Indisponible</div>':''}<button class="add" ${off?'disabled':''} onclick="startProduct(${i})">${CUSTOM_CATS.has(p.cat)||p.kids?'Personnaliser':'Ajouter'}</button></div>`}}h+='</div></section>'}menu.innerHTML=h;}
function ingredientList(p){return (p.desc||'').split(',').map(x=>x.trim()).filter(Boolean)}
function stepList(p){const s=[];if(p.sizes)s.push('size');if(CUSTOM_CATS.has(p.cat))s.push('ingredients');if(p.meatCount)s.push('meats','supps');if(['Burgers','Sandwichs','Paninis'].includes(p.cat))s.push('menu');if(p.kids)s.push('kids');s.push('drink','dessert','summary');return s;}
function startProduct(i){const p=MENU[i];if(!CUSTOM_CATS.has(p.cat)&&!p.kids){cart.push({name:p.name,detail:'',price:p.price});update();afterAdd();return;}wiz={i,p,step:0,size:null,removed:[],meats:[],supps:[],menu:false,kids:null,drink:null,dessert:null};overlay.style.display='flex';renderStep();}
function renderStep(){const p=wiz.p,steps=stepList(p),key=steps[wiz.step];wizTitle.textContent=p.name;wizStep.textContent='Étape '+(wiz.step+1)+' / '+steps.length;backBtn.style.display=wiz.step?'block':'none';nextBtn.style.display='block';nextBtn.textContent=key==='summary'?'Ajouter au panier':'Continuer';nextBtn.onclick=nextStep;if(key==='size'){const a=Object.entries(p.sizes).filter(([s])=>isEnabled('menu',p.cat,p.name+' — '+s));if(!wiz.size)wiz.size=a[0]||null;wizBody.innerHTML='<div class="title2">Choisissez la taille</div><div class="choices">'+a.map(([s,v])=>`<button class="choice ${wiz.size&&wiz.size[0]===s?'selected':''}" onclick="chooseSize('${encodeURIComponent(s)}',${v})"><b>${esc(s)}</b><br>${euro(v)}</button>`).join('')+'</div>';}else if(key==='ingredients'){const a=ingredientList(p);wizBody.innerHTML='<div class="title2">Retirer des ingrédients ?</div><div class="muted">Touchez chaque ingrédient que vous ne voulez pas.</div><div class="choices">'+(a.length?a.map(x=>`<button class="choice ${wiz.removed.includes(x)?'removed':''}" onclick="toggleRemoved('${encodeURIComponent(x)}')">${wiz.removed.includes(x)?'✕':'✓'} ${esc(x)}</button>`).join(''):'<div class="summary">Aucun ingrédient détaillé pour ce produit.</div>')+'</div>';}else if(key==='meats'){const a=TACO_MEATS.filter(m=>isEnabled('taco_meat','Viandes tacos',m.name));wizBody.innerHTML=`<div class="title2">Choisissez ${p.meatCount} viande${p.meatCount>1?'s':''}</div><div class="choices">`+a.map(m=>`<button class="choice ${wiz.meats.includes(m.name)?'selected':''}" onclick="toggleMeat('${encodeURIComponent(m.name)}',${p.meatCount})">${esc(m.name)}${m.extra?'<br><b>+1,00 €</b>':''}</button>`).join('')+'</div>';}else if(key==='supps'){const a=TACO_SUPPLEMENTS.filter(n=>isEnabled('taco_supplement','Suppléments tacos',n));wizBody.innerHTML='<div class="title2">Suppléments tacos</div><div class="muted">Chaque supplément : +1,00 €</div><div class="choices">'+a.map(n=>`<button class="choice ${wiz.supps.includes(n)?'selected':''}" onclick="toggleSupp('${encodeURIComponent(n)}')">${esc(n)}<br><b>+1,00 €</b></button>`).join('')+'</div>';}else if(key==='menu'){const extra=p.cat==='Burgers'?2.40:p.cat==='Sandwichs'?2.50:0;wizBody.innerHTML=`<div class="title2">Vous le voulez en menu ? 🍟🥤</div><div class="choices"><button class="choice ${!wiz.menu?'selected':''}" onclick="setMenu(false)">Produit seul</button><button class="choice ${wiz.menu?'selected':''}" onclick="setMenu(true)">En menu${extra?'<br><b>+'+euro(extra)+'</b>':'<br><b>Option menu</b>'}</button></div>`;}else if(key==='kids'){wizBody.innerHTML=`<div class="title2">Menu enfant — choisissez le plat</div><div class="choices"><button class="choice ${wiz.kids==='Cheeseburger'?'selected':''}" onclick="setKids('Cheeseburger')">🍔 Cheeseburger</button><button class="choice ${wiz.kids==='5 nuggets'?'selected':''}" onclick="setKids('5 nuggets')">🍗 5 nuggets</button></div><div class="summary">Frites + Capri-Sun • 6,00 €</div>`;}else if(key==='drink'){const a=stock.filter(x=>x.type==='drink'&&x.enabled&&x.stock>0).slice(0,20);wizBody.innerHTML='<div class="title2">Ajouter une boisson ? 🥤</div><div class="choices"><button class="choice '+(!wiz.drink?'selected':'')+'" onclick="clearDrink()">Non merci</button>'+a.map(x=>{const pr=x.category.includes('33')?1.5:3;return `<button class="choice ${wiz.drink&&wiz.drink.name===x.name&&wiz.drink.cat===x.category?'selected':''}" onclick="chooseDrink('${encodeURIComponent(x.category)}','${encodeURIComponent(x.name)}',${pr})">${esc(x.name)}<br><small>${esc(x.category)}</small><br><b>${euro(pr)}</b></button>`}).join('')+'</div>';}else if(key==='dessert'){const a=MENU.filter(x=>x.cat==='Desserts & glaces'&&productEnabled(x));wizBody.innerHTML='<div class="title2">Ajouter un dessert ? 🍰</div><div class="choices"><button class="choice '+(!wiz.dessert?'selected':'')+'" onclick="clearDessert()">Non merci</button>'+a.map(x=>`<button class="choice ${wiz.dessert&&wiz.dessert.name===x.name?'selected':''}" onclick="chooseDessert('${encodeURIComponent(x.name)}',${x.price})">${esc(x.name)}<br><b>${euro(x.price)}</b></button>`).join('')+'</div>';}else{const c=calc();wizBody.innerHTML='<div class="title2">Récapitulatif ✅</div><div class="summary">'+c.lines.map(x=>'<div>'+esc(x)+'</div>').join('')+'<hr><b>Total de cet ajout : '+euro(c.total)+'</b></div>';}}
function chooseSize(s,v){wiz.size=[decodeURIComponent(s),v];renderStep()}function toggleRemoved(v){v=decodeURIComponent(v);const i=wiz.removed.indexOf(v);i>=0?wiz.removed.splice(i,1):wiz.removed.push(v);renderStep()}function toggleMeat(v,max){v=decodeURIComponent(v);const i=wiz.meats.indexOf(v);if(i>=0)wiz.meats.splice(i,1);else if(wiz.meats.length<max)wiz.meats.push(v);else return alert('Vous devez choisir seulement '+max+' viande(s).');renderStep()}function toggleSupp(v){v=decodeURIComponent(v);const i=wiz.supps.indexOf(v);i>=0?wiz.supps.splice(i,1):wiz.supps.push(v);renderStep()}function setMenu(v){wiz.menu=v;renderStep()}function setKids(v){wiz.kids=v;renderStep()}function chooseDrink(c,n,p){wiz.drink={cat:decodeURIComponent(c),name:decodeURIComponent(n),price:p};renderStep()}function clearDrink(){wiz.drink=null;renderStep()}function chooseDessert(n,p){wiz.dessert={name:decodeURIComponent(n),price:p};renderStep()}function clearDessert(){wiz.dessert=null;renderStep()}
function prevStep(){if(wiz&&wiz.step>0){wiz.step--;renderStep()}}
function nextStep(){const p=wiz.p,key=stepList(p)[wiz.step];if(key==='meats'&&wiz.meats.length!==p.meatCount)return alert('Choisissez exactement '+p.meatCount+' viande(s).');if(key==='kids'&&!wiz.kids)return alert('Choisissez Cheeseburger ou 5 nuggets.');if(key==='summary'){addConfigured();return;}wiz.step++;renderStep();}
function calc(){const p=wiz.p;let total=p.price||0,detail=[],lines=[p.name];if(p.sizes&&wiz.size){total=Number(wiz.size[1]);detail.push(wiz.size[0]);lines.push('Taille : '+wiz.size[0]);}if(wiz.removed.length){detail.push('Sans : '+wiz.removed.join(', '));lines.push('Sans : '+wiz.removed.join(', '));}if(p.meatCount){const ex=wiz.meats.reduce((s,n)=>s+(TACO_MEATS.find(m=>m.name===n)?.extra||0),0);total+=ex;detail.push('Viandes : '+wiz.meats.join(', '));lines.push('Viandes : '+wiz.meats.join(', ')+(ex?' (+'+euro(ex)+')':''));if(wiz.supps.length){total+=wiz.supps.length;detail.push('Suppléments : '+wiz.supps.join(', '));lines.push('Suppléments : '+wiz.supps.join(', ')+' (+'+euro(wiz.supps.length)+')');}}if(['Burgers','Sandwichs'].includes(p.cat)&&wiz.menu){const ex=p.cat==='Burgers'?2.40:2.50;total+=ex;detail.push('En menu');lines.push('En menu : +'+euro(ex));}if(p.cat==='Paninis'&&wiz.menu){detail.push('En menu');lines.push('En menu');}if(p.kids&&wiz.kids){detail.push(wiz.kids+' + frites + Capri-Sun');lines.push(wiz.kids+' + frites + Capri-Sun');}return {total,detail:detail.join(' • '),lines};}
function addConfigured(){const c=calc();cart.push({name:wiz.p.name,detail:c.detail,price:c.total});if(wiz.drink)cart.push({name:wiz.drink.name,detail:wiz.drink.cat,price:wiz.drink.price});if(wiz.dessert)cart.push({name:wiz.dessert.name,detail:'Dessert',price:wiz.dessert.price});update();closeWizard();afterAdd();}
function quickDrink(c,n,p){c=decodeURIComponent(c);n=decodeURIComponent(n);cart.push({name:n,detail:c,price:p});update();afterAdd();}
function closeWizard(){overlay.style.display='none';wiz=null;}
function afterAdd(){overlay.style.display='flex';wizTitle.textContent='Ajouté au panier ✅';wizStep.textContent='Que voulez-vous faire ?';wizBody.innerHTML='<div class="choices"><button class="choice" onclick="closeWizard()">🍕 Continuer à commander</button><button class="choice selected" onclick="closeWizard();openCart()">🛒 Voir le panier / paiement</button></div>';backBtn.style.display='none';nextBtn.style.display='none';}
function update(){count.textContent=cart.length;total.textContent=euro(cart.reduce((s,x)=>s+x.price,0))}function openCart(){cartModal.style.display='flex';items.innerHTML=cart.length?cart.map((x,i)=>`<div class="row"><div><b>${esc(x.name)}</b><br><small>${esc(x.detail||'')}</small></div><div>${euro(x.price)} <button onclick="cart.splice(${i},1);update();openCart()">Retirer</button></div></div>`).join(''):'Panier vide'}function closeCart(){cartModal.style.display='none'}function checkout(){if(!cart.length)return alert('Panier vide.');if(!customerName.value||!phone.value)return alert('Nom et téléphone requis.');alert('Parcours prêt. Paiement réel à connecter ensuite.');}
boot();update();
</script></body></html>
